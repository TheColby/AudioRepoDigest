name: AudioRepoDigest Heartbeat

on:
  schedule:
    - cron: "45 19 * * 0"
  workflow_dispatch:
    inputs:
      recipient_email:
        description: Optional recipient override for manual runs
        required: false
        type: string
      recipient_name:
        description: Optional recipient name override for manual runs
        required: false
        type: string

concurrency:
  group: audiodigest-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Validate required secrets
        env:
          GITHUB_TOKEN: ${{ secrets.AUDIOREPODIGEST_GITHUB_TOKEN || github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email || secrets.REPORT_RECIPIENT_EMAIL }}
          REPORT_RECIPIENT_NAME: ${{ github.event.inputs.recipient_name || secrets.REPORT_RECIPIENT_NAME }}
        run: |
          missing=0
          for key in \
            GITHUB_TOKEN \
            SMTP_HOST \
            SMTP_PORT \
            SMTP_USERNAME \
            SMTP_PASSWORD \
            SMTP_FROM \
            REPORT_RECIPIENT_EMAIL \
            REPORT_RECIPIENT_NAME
          do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing required secret::${key} is empty or not set."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Send heartbeat email
        env:
          GITHUB_TOKEN: ${{ secrets.AUDIOREPODIGEST_GITHUB_TOKEN || github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_STARTTLS: ${{ secrets.SMTP_USE_STARTTLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          REPORT_RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email || secrets.REPORT_RECIPIENT_EMAIL }}
          REPORT_RECIPIENT_NAME: ${{ github.event.inputs.recipient_name || secrets.REPORT_RECIPIENT_NAME }}
          REPORT_TIMEZONE: ${{ secrets.REPORT_TIMEZONE || 'America/New_York' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
          EMAIL_SUBJECT_PREFIX: ${{ secrets.EMAIL_SUBJECT_PREFIX || '[AudioRepoDigest]' }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.recipient_email }}" ]; then
            ARGS+=("--recipient-email" "${{ github.event.inputs.recipient_email }}")
          fi
          if [ -n "${{ github.event.inputs.recipient_name }}" ]; then
            ARGS+=("--recipient-name" "${{ github.event.inputs.recipient_name }}")
          fi
          uv run audiodigest send-heartbeat-email "${ARGS[@]}"
